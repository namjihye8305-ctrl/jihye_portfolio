<style>
/* ===== 1. 怨듯넻 ?ㅼ젙 ===== */
* { box-sizing: border-box; }

.pc-only { display: block !important; }
.mo-only { display: none !important; }

@media (max-width: 768px) {
    .pc-only { display: none !important; visibility: hidden !important; height: 0 !important; overflow: hidden !important; }
    .mo-only { display: block !important; }
}

/* ===== PC ?꾩껜 ?섑띁: 1920px 以묒븰 ?뺣젹 ===== */
.pc-only {
    max-width: 1920px;
    margin-left: auto;
    margin-right: auto;
    width: 100%;
    line-height: 0;
    font-size: 0;
}
.pc-only > * {
    margin-top: 0 !important;
    margin-bottom: 0 !important;
}

@media (min-width: 769px) {
    .pc-only img {
        display: block;
        max-width: 1920px;
        width: 100%;
        margin-left: auto;
        margin-right: auto;
    }
}

/* MO ?꾩껜 媛?대뜲 ?뺣젹 */
.mo-only {
    max-width: 750px;
    margin-left: auto;
    margin-right: auto;
    width: 100%;
}
.mo-only img {
    display: block;
    width: 100%;
    margin-left: auto;
    margin-right: auto;
}

.visual-wrap {
    position: relative;
    width: 100%;
    overflow: hidden;
    line-height: 0;
    font-size: 0;
    max-width: 1920px;
    margin: 0 auto !important;
    padding: 0 !important;
}
.visual-wrap a { display: block; width: 100%; line-height: 0; cursor: pointer; margin: 0 !important; padding: 0 !important; }
.visual-wrap img { display: block; margin: 0 !important; padding: 0 !important; border: 0; }
.bg-img { width: 100%; display: block; height: auto; border: 0; }

/* ===== 2. ?곷떒 ?먮룞 ?먮쫫 ?щ씪?대뜑 (Infinite Loop) ===== */
.auto-section .c24-slider { position: absolute; z-index: 100; overflow: hidden; }
.auto-section .viewport { width: 100%; height: 100%; overflow: hidden; position: relative; }

.auto-section .track {
    display: flex;
    width: 400%;
    height: 100%;
    animation: infiniteScroll 10s linear infinite;
    will-change: transform;
}
.auto-section .slide { flex: 0 0 25%; height: 100%; }
.auto-section .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }

@keyframes infiniteScroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

.pc-inner-slider.pos-02 .viewport {
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 8px, black calc(100% - 8px), transparent 100%);
    mask-image: linear-gradient(to right, transparent 0%, black 8px, black calc(100% - 8px), transparent 100%);
}

.pc-inner-slider {
    left:   calc((var(--pc-s-x) / var(--pc-bg-w)) * 100%);
    top:    calc((var(--pc-s-y) / var(--pc-bg-h)) * 100%);
    width:  calc((var(--pc-s-w) / var(--pc-bg-w)) * 100%);
    height: calc((var(--pc-s-h) / var(--pc-bg-h)) * 100%);
}
.pc-inner-slider.pos-02 { --pc-bg-w:1920; --pc-bg-h:1000; --pc-s-x:952; --pc-s-y:0; --pc-s-w:980; --pc-s-h:1000; }

.mo-inner-slider {
    left:   calc((var(--mo-s-x) / var(--mo-bg-w)) * 100%);
    top:    calc((var(--mo-s-y) / var(--mo-bg-h)) * 100%);
    width:  calc((var(--mo-s-w) / var(--mo-bg-w)) * 100%);
    height: calc((var(--mo-s-h) / var(--mo-bg-h)) * 100%);
}
.mo-inner-slider.pos-mo-02 { --mo-bg-w:750; --mo-bg-h:1000; --mo-s-x:375; --mo-s-y:0; --mo-s-w:375; --mo-s-h:1000; }

/* ===== 3. ?꾪듃 ?щ씪?대뜑 ???щ줈?ㅽ럹?대뱶 ?꾪솚 ===== */
.snap-section { position: relative; }

/* radio ?④? */
.pc-only .snap-section input[type="radio"],
.mo-only .snap-section input[type="radio"] { display: none !important; }

/* PC: 利됱떆 ?꾪솚 */
.pc-only .snap-section .viewport { width: 100%; position: relative; line-height: 0; font-size: 0; }
.pc-only .snap-section .track { display: block; position: relative; }
.pc-only .snap-section .slide {
    display: none;
    width: 100%;
}
.pc-only .snap-section .slide.is-active {
    display: block;
}
.pc-only .snap-section .slide img { width: 100%; height: auto; display: block; border: 0; }

/* MO: 利됱떆 ?꾪솚 */
.mo-only .snap-section .viewport { width: 100%; position: relative; line-height: 0; font-size: 0; }
.mo-only .snap-section .track { display: block; position: relative; }
.mo-only .snap-section .slide {
    display: none;
    width: 100%;
}
.mo-only .snap-section .slide.is-active {
    display: block;
}
.mo-only .snap-section .slide img { width: 100%; height: auto; display: block; border: 0; }

/* ===== c24-slider three ===== */
.c24-slider {
    position: relative;
    width: 100%;
    max-width: 1920px;
    margin: 0 auto;
    --hit-prev: 36%;
    --hit-next: 36%;
}
	
/* ===== c24-slider input ?ъ빱???ㅽ겕濡??꾩쟾 李⑤떒 ===== */
.c24-slider input[type="radio"] {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 1px !important;
    height: 1px !important;
    opacity: 0 !important;
    pointer-events: none !important;
    z-index: -1 !important;
}
	
.c24-slider .viewport { position: relative; width: 100%; overflow: hidden; }
.c24-slider .track { display: flex; align-items: flex-start; transition: transform 0.35s ease; }
.c24-slider .slide { position: relative; flex: 0 0 100%; width: 100% !important; float: none !important; box-sizing: border-box; }
.c24-slider .slide img { width: 100%; height: auto; display: block; border: 0; }
.c24-slider .slide .slide-link {
    position: absolute; top: 0; bottom: 0;
    left: var(--hit-prev); right: var(--hit-next);
    display: block; z-index: 4;
}

.c24-slider.three .track { transform: translateX(0); }
.c24-slider.three input[id$="-2"]:checked ~ .viewport .track { transform: translateX(-100%); }
.c24-slider.three input[id$="-3"]:checked ~ .viewport .track { transform: translateX(-200%); }

.c24-slider .hit {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 5;
}
.c24-slider .hit .prev,
.c24-slider .hit .next {
    position: absolute; top: 0; bottom: 0;
    background: transparent; cursor: pointer;
    pointer-events: auto; display: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none; touch-action: manipulation;
}
.c24-slider .hit .prev { left: 0; width: var(--hit-prev); }
.c24-slider .hit .next { right: 0; width: var(--hit-next); }

.c24-slider.three input[id$="-1"]:checked ~ .hit .prev-1,
.c24-slider.three input[id$="-1"]:checked ~ .hit .next-1,
.c24-slider.three input[id$="-2"]:checked ~ .hit .prev-2,
.c24-slider.three input[id$="-2"]:checked ~ .hit .next-2,
.c24-slider.three input[id$="-3"]:checked ~ .hit .prev-3,
.c24-slider.three input[id$="-3"]:checked ~ .hit .next-3 { display: block; }

@media (max-width: 768px) {
    .c24-slider { --hit-prev: 10%; --hit-next: 10%; }
    .c24-slider .slide .slide-link { left: 0; right: 0; width: 100%; }
}

/* ===== ?ㅽ겕濡?紐⑥뀡 ===== */

/* bg-img: 釉붾윭 ???좊챸 */
.coupon-reveal-wrap .bg-img {
    filter: blur(16px);
    transform: scale(1.03);
    transition: filter 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                transform 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.coupon-reveal-wrap.on .bg-img {
    filter: blur(0px);
    transform: scale(1);
}

.coupon-reveal-wrap .png-obj {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: auto;
    z-index: 20;
    opacity: 0;
    transform: translateY(50px);
    transition: all 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    pointer-events: none;
}
.coupon-reveal-wrap.on .png-obj {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
}

@media (max-width: 768px) {
    .coupon-reveal-wrap .png-obj { transform: translateY(50px); }
}

// ===== 釉뚮옖???쇱??댁뒪 珥덇린??=====
function initBrandShowcase(navId, panelSelector) {
    var navBtns = document.querySelectorAll('#' + navId + ' .bs-nav-btn');
    var panels  = document.querySelectorAll(panelSelector);
    var current = 0;

    // ?몃꽕???щ씪?대뜑 ?곹깭 (?몃옓 ID蹂?
    var thumbState = {};

    function goPanel(idx) {
        panels[current].classList.remove('is-active');
        navBtns[current].classList.remove('is-active');
        current = idx;
        panels[current].classList.add('is-active');
        navBtns[current].classList.add('is-active');
    }

    navBtns.forEach(function(btn, idx) {
        btn.addEventListener('click', function() {
            if (idx === current) return;
            goPanel(idx);
        });
    });

    // ?몃꽕???щ씪?대뜑 - ?붿궡??醫뚯슦 臾댄븳 猷⑦봽
    var isMo = navId.indexOf('mo') === 0;
    var visibleCount = 4;

    document.querySelectorAll(panelSelector + ' .bs-arrow').forEach(function(arrow) {
        arrow.addEventListener('click', function() {
            var target  = this.getAttribute('data-target');
            var trackId = (isMo ? 'mo' : 'pc') + '-thumb-track-' + target.replace('mo-', '');
            var trackEl = document.getElementById(trackId);
            if (!trackEl) return;

            var thumbs  = trackEl.querySelectorAll('.bs-thumb');
            var total   = thumbs.length;
            var maxStep = total - visibleCount;
            if (maxStep < 0) maxStep = 0;

            if (!thumbState[target]) thumbState[target] = 0;

            var step = thumbState[target];
            if (this.classList.contains('bs-next')) {
                step = (step >= maxStep) ? 0 : step + 1;
            } else {
                step = (step <= 0) ? maxStep : step - 1;
            }
            thumbState[target] = step;

            var thumbW = trackEl.querySelector('.bs-thumb').offsetWidth + 8;
            trackEl.style.transform = 'translateX(-' + (thumbW * step) + 'px)';
        });
    });
}

// ===== MO ?곗튂 PNG ?щ씪?대뜑 =====
(function() {
    var slider  = document.getElementById('mo-png-slider');
    var track   = document.getElementById('mo-png-slider-track');
    if (!slider || !track) return;

    var slides  = track.querySelectorAll('.mo-png-slide');
    var total   = slides.length;
    var current = 0;
    var startX  = 0;
    var threshold = 40; // ?ㅼ??댄봽 ?몄떇 理쒖냼 px

    function goTo(idx) {
        if (idx < 0) idx = 0;
        if (idx > total - 1) idx = total - 1;
        current = idx;
        var slideW = slides[0].offsetWidth + 10; // gap 10px ?ы븿
        track.style.transform = 'translateX(-' + (slideW * current) + 'px)';
    }

    slider.addEventListener('touchstart', function(e) {
        startX = e.touches[0].clientX;
    }, { passive: true });

    slider.addEventListener('touchend', function(e) {
        var diff = startX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > threshold) {
            goTo(diff > 0 ? current + 1 : current - 1);
        }
    }, { passive: true });
})();


// ===== PC ?щ씪?대뜑 hit ?곸뿭 ?대┃ ???ㅽ겕濡?諛⑹? =====
document.querySelectorAll('.pc-only .c24-slider .hit label').forEach(function(label) {
    label.addEventListener('click', function(e) {
        e.preventDefault();
        var forId = this.getAttribute('for');
        var radio = document.getElementById(forId);
        if (radio) {
            radio.checked = true;
            radio.dispatchEvent(new Event('change'));
        }
    });
});

// ===== LINE-UP ?ㅻ퉬 smooth scroll =====
document.querySelectorAll('.lineup-nav-item[data-anchor]').forEach(function(item) {
    item.addEventListener('click', function(e) {
        e.preventDefault();
        var anchorId = this.getAttribute('data-anchor');
        var target = document.getElementById(anchorId);
        if (target) {
            var offset = target.getBoundingClientRect().top + window.pageYOffset - 0;
            window.scrollTo({ top: offset, behavior: 'smooth' });
        }
    });
});


// ===== PC 페이드 인/아웃 이미지 자동 전환 =====
(function() {
    var slider = document.querySelector('.pc-only .pc-fade-slider');
    if (!slider) return;
    var imgs = slider.querySelectorAll('img');
    if (imgs.length < 2) return;

    var idx = 0;
    var DISPLAY_MS = 2500;
    setInterval(function() {
        imgs[idx].classList.remove('is-active');
        idx = (idx + 1) % imgs.length;
        imgs[idx].classList.add('is-active');
    }, DISPLAY_MS);
})();
